[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "the_petabyte_project"
version = "0.0.1"
authors = [ { name="Sarah Burke-Spolaor", email="sarah.spolaor@mail.wvu.edu" },
	    { name="Reshma Anna-Thomas", email="" },
	    { name="Bikash Kharel", email="" },
	    { name="Jordan Stanley", email="" },
	    ]
description = "Infrastructure and pipeline package for The Petabyte Project."
readme = "README.md"
requires-python = ">3.7"
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.urls]
"Homepage" = "http://sarahspolaor.faculty.wvu.edu/"
"Issues" = "https://github.com/thepetabyteproject/tpp/issues"

[tool.ruff]
# Default line length, same as Black
line-length = 88
# Lowest Python version declared in requires-python above.
target-version = "py38"

# Exclude common virtual environment folders and build artifacts.
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle error (E) and warning (W) rules, and isort (I).
select = ["E", "F", "I", "W"]

[tool.ruff.format]
# This enables ruff's formatter. It's black-compatible by default.